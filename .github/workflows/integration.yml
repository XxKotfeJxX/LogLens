name: integration

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/integration.yml"
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  sqlite-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - name: Real SQLite and HTTP integration
        run: go test -count=1 ./internal/api

