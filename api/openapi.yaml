openapi: 3.1.0
info:
  title: LogLens API
  version: 0.1.0
  description: Streaming import and seek-based exploration of large log files.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: ready
      responses:
        "200":
          description: Process and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
  /api/v1/sources/upload:
    post:
      operationId: uploadSource
      summary: Stream a log file into managed local storage and detect its format
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Source stored
          content:
            application/json:
              schema:
                type: object
                required: [source, detection]
                properties:
                  source:
                    $ref: "#/components/schemas/Source"
                  detection:
                    $ref: "#/components/schemas/Detection"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"
  /api/v1/sources/import:
    post:
      operationId: importServerSource
      summary: Register a regular file below the configured IMPORT_ROOT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relativePath]
              additionalProperties: false
              properties:
                relativePath:
                  type: string
                  examples: ["services/api.jsonl"]
      responses:
        "201":
          description: Server source registered
          content:
            application/json:
              schema:
                type: object
                required: [source, detection]
                properties:
                  source:
                    $ref: "#/components/schemas/Source"
                  detection:
                    $ref: "#/components/schemas/Detection"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /api/v1/sources/:
    get:
      operationId: listSources
      responses:
        "200":
          description: Source library
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Source"
  /api/v1/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getSource
      responses:
        "200":
          description: Source metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSource
      summary: Delete source metadata, index rows, and managed raw file
      responses:
        "204":
          description: Deleted
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/sources/{sourceId}/detect:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    post:
      operationId: detectSource
      responses:
        "200":
          description: Detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detection"
  /api/v1/sources/{sourceId}/imports:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    post:
      operationId: startImport
      summary: Start or restart streaming indexing
      responses:
        "202":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/imports/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: getImport
      responses:
        "200":
          description: Current import state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJob"
  /api/v1/imports/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      operationId: cancelImport
      responses:
        "202":
          description: Cancellation requested
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/imports/{jobId}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      operationId: streamImportEvents
      summary: SSE stream of throttled import state changes
      responses:
        "200":
          description: import.started, import.progress, import.completed, import.failed, or import.cancelled events
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/sources/{sourceId}/entries:
    parameters:
      - $ref: "#/components/parameters/SourceId"
      - name: cursor
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      - name: levels
        in: query
        description: Comma-separated normalized levels
        schema:
          type: string
      - name: services
        in: query
        description: Comma-separated exact service names
        schema:
          type: string
      - name: requestId
        in: query
        schema:
          type: string
      - name: query
        in: query
        description: Case-insensitive substring filter applied to raw entries
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
    get:
      operationId: listEntries
      responses:
        "200":
          description: Seek-hydrated entry window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
  /api/v1/sources/{sourceId}/entries/{entryNumber}:
    parameters:
      - $ref: "#/components/parameters/SourceId"
      - $ref: "#/components/parameters/EntryNumber"
    get:
      operationId: getEntry
      responses:
        "200":
          description: Raw and parsed entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
  /api/v1/sources/{sourceId}/entries/{entryNumber}/context:
    parameters:
      - $ref: "#/components/parameters/SourceId"
      - $ref: "#/components/parameters/EntryNumber"
      - name: before
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 20
      - name: after
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100
          default: 20
    get:
      operationId: getEntryContext
      responses:
        "200":
          description: Entry window around the selected entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPage"
  /api/v1/sources/{sourceId}/statistics:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getStatistics
      responses:
        "200":
          description: Source aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
  /api/v1/sources/{sourceId}/timeline:
    parameters:
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getTimeline
      responses:
        "200":
          description: Bounded adaptive timeline buckets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TimelinePoint"
components:
  parameters:
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryNumber:
      name: entryNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Source:
      type: object
      required: [id, name, originalName, sourceType, format, status, sizeBytes, entryCount, parsedCount, failedCount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        originalName:
          type: string
        sourceType:
          type: string
          enum: [uploaded_file, server_file, watched_file, remote_agent]
        format:
          type: string
          enum: [jsonl, plain_text]
        status:
          type: string
          enum: [uploaded, queued, importing, ready, partially_parsed, failed, cancelled]
        sizeBytes:
          type: integer
        entryCount:
          type: integer
        parsedCount:
          type: integer
        failedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        importedAt:
          type: string
          format: date-time
    ImportJob:
      type: object
      required: [id, sourceId, status, bytesProcessed, totalBytes, entriesFound, parseFailures]
      properties:
        id:
          type: string
          format: uuid
        sourceId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled, interrupted]
        bytesProcessed:
          type: integer
        totalBytes:
          type: integer
        entriesFound:
          type: integer
        parseFailures:
          type: integer
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        errorCode:
          type: string
        errorMessage:
          type: string
    Detection:
      type: object
      required: [format, confidence, detectedFields, preview]
      properties:
        format:
          type: string
          enum: [jsonl, plain_text]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        detectedFields:
          type: object
          additionalProperties:
            type: string
        preview:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
    Entry:
      type: object
      required: [number, byteOffset, byteLength, level, message, parseStatus, raw]
      properties:
        number:
          type: integer
        byteOffset:
          type: integer
        byteLength:
          type: integer
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [TRACE, DEBUG, INFO, WARN, ERROR, FATAL, UNKNOWN]
        service:
          type: string
        requestId:
          type: string
        message:
          type: string
        parseStatus:
          type: string
          enum: [parsed, partial, unparsed, malformed, oversized]
        raw:
          type: string
        fields:
          type: object
          additionalProperties: true
    EntryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        page:
          type: object
          required: [hasMore]
          properties:
            nextCursor:
              type: integer
            hasMore:
              type: boolean
    Statistics:
      type: object
      required: [totalEntries, parsedEntries, malformedEntries, byLevel, byService]
      properties:
        totalEntries:
          type: integer
        parsedEntries:
          type: integer
        malformedEntries:
          type: integer
        earliestTimestamp:
          type: string
          format: date-time
        latestTimestamp:
          type: string
          format: date-time
        byLevel:
          type: object
          additionalProperties:
            type: integer
        byService:
          type: object
          additionalProperties:
            type: integer
    TimelinePoint:
      type: object
      required: [timestamp, count, errors]
      properties:
        timestamp:
          type: string
          format: date-time
        count:
          type: integer
        errors:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
