name: loglens

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      WEB_ORIGIN: http://localhost:8088
      DATABASE_PATH: /data/loglens.db
      SOURCE_STORAGE_PATH: /data/sources
      TEMP_STORAGE_PATH: /data/temp
      EXPORT_STORAGE_PATH: /data/exports
      MAX_UPLOAD_SIZE: 20GB
      MAX_ENTRY_SIZE: 4MB
      IMPORT_BATCH_SIZE: 2000
      LOG_LEVEL: info
    volumes:
      - loglens-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  loglens-data:

